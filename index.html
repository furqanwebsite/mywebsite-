<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="n4FeHZahbf9JQmGLMFIZxmoxvYty4tMW77FMCxDUaJI" />

    <meta name="description" content="ToolHub provides free online calculators and useful tools including age calculator, percentage calculator and unit converter.">

    <meta name="keywords" content="free online tools, calculator, age calculator, percentage calculator, unit converter">

    <title>ToolHub - Free Online Tools</title>

    <link rel="stylesheet" href="./Style.css">
</head>

<body>

<header>
    <div class="container nav-container">
        <h2>ToolHub</h2>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./About.html">About</a>
            <a href="./Contact.html">Contact</a>
            <button id="darkModeBtn" type="button">🌙</button>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container">
        <span class="badge">FREE ONLINE TOOLS</span>

        <h1>Useful Tools in One Place</h1>

        <p>
            Free and simple online tools for everyday calculations.
        </p>
    </div>
</section>

<section class="tools">

    <div class="container">

        <h2>Our Tools</h2>

        <div class="tool-grid">

            <!-- AGE CALCULATOR -->

            <div class="tool-card">

                <h3>🎂 Age Calculator</h3>

                <input
                    type="date"
                    id="birthDate"
                >

                <button
                    type="button"
                    id="ageBtn"
                >
                    Calculate Age
                </button>

                <div
                    id="ageResult"
                    class="result"
                ></div>

            </div>


            <!-- CALCULATOR -->

            <div class="tool-card calculator-card">

                <h3>🧮 Calculator</h3>

                <input
                    type="text"
                    id="calcDisplay"
                    value=""
                    placeholder="0"
                    readonly
                >

                <div class="calculator">

                    <button type="button" data-value="clear">
                        C
                    </button>

                    <button type="button" data-value="delete">
                        ⌫
                    </button>

                    <button type="button" data-value="/">
                        ÷
                    </button>

                    <button type="button" data-value="*">
                        ×
                    </button>

                    <button type="button" data-value="7">
                        7
                    </button>

                    <button type="button" data-value="8">
                        8
                    </button>

                    <button type="button" data-value="9">
                        9
                    </button>

                    <button type="button" data-value="-">
                        −
                    </button>

                    <button type="button" data-value="4">
                        4
                    </button>

                    <button type="button" data-value="5">
                        5
                    </button>

                    <button type="button" data-value="6">
                        6
                    </button>

                    <button type="button" data-value="+">
                        +
                    </button>

                    <button type="button" data-value="1">
                        1
                    </button>

                    <button type="button" data-value="2">
                        2
                    </button>

                    <button type="button" data-value="3">
                        3
                    </button>

                    <button type="button" data-value="=">
                        =
                    </button>

                    <button
                        type="button"
                        data-value="0"
                        class="zero"
                    >
                        0
                    </button>

                    <button type="button" data-value=".">
                        .
                    </button>

                </div>

            </div>


            <!-- PERCENTAGE -->

            <div class="tool-card">

                <h3>📊 Percentage Calculator</h3>

                <input
                    type="number"
                    id="percent"
                    placeholder="Percentage"
                >

                <input
                    type="number"
                    id="percentNumber"
                    placeholder="Number"
                >

                <button
                    type="button"
                    id="percentageBtn"
                >
                    Calculate
                </button>

                <div
                    id="percentageResult"
                    class="result"
                ></div>

            </div>


            <!-- UNIT CONVERTER -->

            <div class="tool-card">

                <h3>📏 Unit Converter</h3>

                <input
                    type="number"
                    id="unitValue"
                    placeholder="Enter value"
                >

                <select id="unitFrom">

                    <option value="meter">
                        Meter
                    </option>

                    <option value="kilometer">
                        Kilometer
                    </option>

                    <option value="feet">
                        Feet
                    </option>

                    <option value="inch">
                        Inch
                    </option>

                </select>

                <select id="unitTo">

                    <option value="meter">
                        Meter
                    </option>

                    <option value="kilometer">
                        Kilometer
                    </option>

                    <option value="feet">
                        Feet
                    </option>

                    <option value="inch">
                        Inch
                    </option>

                </select>

                <button
                    type="button"
                    id="convertBtn"
                >
                    Convert
                </button>

                <div
                    id="unitResult"
                    class="result"
                ></div>

            </div>

        </div>

    </div>

</section>

<footer>

    <div class="container">

        <p>
            © 2026 ToolHub. All Rights Reserved.
        </p>

    </div>

</footer>

<script src="./script.js"></script>

</body>
</html>
